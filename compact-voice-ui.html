<div id="compact-voice-ui" class="viz-dotted-background" aria-label="VoiceInput compact UI mockup">
  <style>
    #compact-voice-ui {
      --ui-bg: light-dark(#eef2f6, #151a20);
      --ui-window: light-dark(#ffffff, #20262e);
      --ui-surface: light-dark(#f6f8fa, #292f38);
      --ui-border: light-dark(#d8dee6, #3b4552);
      --ui-text: light-dark(#1b2430, #f2f5f8);
      --ui-muted: light-dark(#6c7785, #aeb8c4);
      --ui-accent: light-dark(#245db3, #79a9ff);
      --ui-accent-soft: light-dark(#e6effc, #223b60);
      --ui-danger: light-dark(#c63c46, #ff858b);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ui-text);
      background: var(--ui-bg);
      min-height: 620px;
      display: grid;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
    }

    #compact-voice-ui * { box-sizing: border-box; }

    #compact-voice-ui .window {
      width: min(720px, 100%);
      background: var(--ui-window);
      border: 1px solid var(--ui-border);
      border-radius: 18px;
      box-shadow: 0 18px 50px color-mix(in srgb, var(--ui-text) 12%, transparent);
      overflow: hidden;
    }

    #compact-voice-ui .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--ui-border);
    }

    #compact-voice-ui .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #compact-voice-ui .mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--ui-accent-soft);
      color: var(--ui-accent);
      font-size: 18px;
      font-weight: 700;
    }

    #compact-voice-ui h1,
    #compact-voice-ui h2,
    #compact-voice-ui p { margin: 0; }

    #compact-voice-ui h1 { font-size: 18px; font-weight: 600; }
    #compact-voice-ui .subtitle { margin-top: 3px; color: var(--ui-muted); font-size: 12px; }

    #compact-voice-ui .language {
      display: grid;
      gap: 5px;
      min-width: 132px;
    }

    #compact-voice-ui label {
      color: var(--ui-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #compact-voice-ui select,
    #compact-voice-ui button {
      font: inherit;
      color: var(--ui-text);
      border: 1px solid var(--ui-border);
      border-radius: 9px;
      background: var(--ui-window);
    }

    #compact-voice-ui select {
      height: 34px;
      padding: 0 10px;
      outline: none;
    }

    #compact-voice-ui .content { padding: 26px 24px 24px; }

    #compact-voice-ui .hero {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    #compact-voice-ui h2 { font-size: 25px; letter-spacing: -.02em; }
    #compact-voice-ui .description { color: var(--ui-muted); font-size: 14px; }

    #compact-voice-ui .record-zone {
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 26px 20px 24px;
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
    }

    #compact-voice-ui .record-button {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      border: 8px solid var(--ui-accent-soft);
      background: var(--ui-accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--ui-accent) 28%, transparent);
    }

    #compact-voice-ui .record-button span { display: block; font-size: 25px; margin-bottom: 4px; }
    #compact-voice-ui .hint { color: var(--ui-muted); font-size: 12px; }

    #compact-voice-ui .result-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin: 24px 0 8px;
    }

    #compact-voice-ui .result-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
    #compact-voice-ui .result-head span { color: var(--ui-muted); font-size: 11px; }

    #compact-voice-ui textarea {
      display: block;
      width: 100%;
      min-height: 106px;
      resize: none;
      padding: 13px;
      border: 1px solid var(--ui-border);
      border-radius: 10px;
      background: var(--ui-window);
      color: var(--ui-text);
      font: inherit;
      line-height: 1.6;
      outline: none;
    }

    #compact-voice-ui .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    #compact-voice-ui .link-zone { margin-top: 20px; }
    #compact-voice-ui .link-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    #compact-voice-ui .link-row input {
      flex: 1 1 170px;
      min-width: 0;
      padding: 8px 10px;
      font: inherit;
      border: 1px solid var(--ui-border);
      border-radius: 9px;
      background: var(--ui-window);
      color: var(--ui-text);
    }
    #compact-voice-ui .more-options { margin-top: 14px; color: var(--ui-muted); }

    #compact-voice-ui button { padding: 9px 13px; font-size: 12px; }
    #compact-voice-ui .primary { background: var(--ui-accent); border-color: var(--ui-accent); color: white; }
    #compact-voice-ui .quiet { color: var(--ui-muted); }

    @media (max-width: 560px) {
      #compact-voice-ui { padding: 12px; min-height: 600px; }
      #compact-voice-ui .topbar { align-items: flex-start; flex-direction: column; }
      #compact-voice-ui .language { width: 100%; }
      #compact-voice-ui .content { padding: 22px 16px 18px; }
      #compact-voice-ui .actions { justify-content: stretch; }
      #compact-voice-ui .actions button { flex: 1; }
    }
  </style>

  <section class="window">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">◉</div>
        <div>
          <h1>VoiceInput</h1>
          <p class="subtitle">简洁、快速的语音输入</p>
        </div>
      </div>
      <div class="language">
        <label for="ui-language">界面语言</label>
        <select id="ui-language" aria-label="界面语言">
          <option>简体中文</option>
          <option>繁體中文</option>
          <option>English</option>
        </select>
      </div>
    </header>

    <main class="content">
      <div class="hero">
        <h2>说话，自动转成文字</h2>
        <p class="description">点击下方按钮开始录音，完成后再次点击即可识别。</p>
      </div>

      <section class="record-zone" aria-label="录音区域">
        <button class="record-button primary" type="button" aria-label="开始录音">
          <span aria-hidden="true">●</span>
          开始录音
        </button>
        <p class="hint">快捷键 Ctrl + Shift + F9</p>
      </section>

      <section class="link-zone" aria-label="链接转写">
        <label for="video-link">公开视频链接（YouTube 或 B 站）</label>
        <div class="link-row">
          <input id="video-link" type="url" placeholder="https://…"/>
          <button type="button">开始转写</button>
        </div>
      </section>

      <div class="result-head">
        <h3>识别结果</h3>
        <span>可直接编辑</span>
      </div>
      <textarea aria-label="识别结果">今天的会议重点是尽量让操作更简单，减少不必要的按钮。</textarea>
      <div class="actions">
        <button class="quiet" type="button">清空</button>
        <button class="primary" type="button">复制结果</button>
      </div>
      <details class="more-options">
        <summary>更多选项</summary>
        <p class="hint">识别语言、引擎与云端设置、重新识别、确认输入、保存 TXT、识别日志</p>
      </details>
    </main>
  </section>
</div>
